read-copy from pr2/. Never execute original programs, alter references,
stage/commit/push/merge, contact GitHub, or delegate. Stop and report any
failure or policy block; never weaken guards or retry by changing commands.
Return the existing
automation/worker-result.schema.json shape with commands and outcomes. Keep
logs and validation output in the supplied absolute private analysis path.
"""
